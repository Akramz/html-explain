<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How html-explain works</title>
<style>
:root {
  --ink: #1d1d1f; --mute: #6e6e73; --line: #d2d2d7; --bg: #f5f5f7; --card: #fff;
  --core: #fff6e0; --coreline: #e0a800; --part: #c98a00; --uses: #0a66c2; --usedby: #8e44ad;
  --flag: #e5534b; --new: #1f7a52; --agent: #0a66c2;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: #0000000d; padding: 0 3px; border-radius: 3px; }
header { padding: 16px 24px 8px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
.sub { color: var(--mute); }
.legend { display: flex; gap: 14px; color: var(--mute); font-size: 12px; align-items: center; flex-wrap: wrap; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
.sw.part { background: var(--part); border-color: var(--part); }
.sw.step { border: 2px solid var(--coreline); }
.sw.dot { background: var(--flag); border-color: var(--flag); border-radius: 50%; width: 8px; height: 8px; }
.sw.chg { border-left: 4px solid var(--uses); }
.sw.gone { background: #fdecea; border: 1px dashed var(--flag); }
.sw.new { background: #eef8f2; border: 1px dashed var(--new); }
.legend .u { color: var(--uses); }
.legend .b { color: var(--usedby); }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
.switch button { border: 0; background: none; padding: 5px 14px; font: inherit; cursor: pointer; color: var(--mute); }
.switch button.on { background: var(--ink); color: #fff; }
.wrap { display: flex; gap: 16px; padding: 8px 24px 80px; align-items: flex-start; }
#board { position: relative; flex: 1; display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
#wires { position: absolute; inset: 0; overflow: visible; z-index: 7; pointer-events: none; }
#wires path.w { fill: none; stroke: #8e8e93; stroke-width: 1.8; stroke-linecap: round; }
#wires path.u { stroke: var(--uses); stroke-width: 2.2; }
#wires path.b { stroke: var(--usedby); stroke-width: 2.2; stroke-dasharray: 6 4; }
#wires path.bg { stroke: #c7c7cc; stroke-width: 1.2; }
#wires .head { fill: #8e8e93; }
#wires .head.u { fill: var(--uses); }
#wires .head.b { fill: var(--usedby); }
#wires text.w { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #6e6e73; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
#wires text.u { fill: var(--uses); }
#wires text.b { fill: var(--usedby); }
.zone { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; }
.zone h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 0 0 8px; font-weight: 600; }
.zone .why { font-size: 12px; color: var(--mute); margin: -4px 0 8px; }
.zone.core { background: var(--core); border: 2px solid var(--coreline); }
.zone.core h2, .zone.core .cols h3, .zone.core .flowline { color: #8a5d00; }
.zone.outside { border: 1px dashed var(--new); background: #f7fcf9; }
.nodes { display: flex; flex-wrap: wrap; gap: 8px; }
.cols { display: grid; gap: 10px 22px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 8px; position: relative; }
.col h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
.col .arrow { position: absolute; right: -19px; top: 50%; color: var(--coreline); font-size: 18px; font-weight: 700; }
.flowline { text-align: center; color: var(--mute); font-size: 12px; border-top: 2px dashed var(--coreline); padding-top: 4px; margin-top: 10px; }
.node { position: relative; z-index: 6; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 112px; transition: opacity .15s, box-shadow .15s; }
.node:hover { box-shadow: 0 1px 6px rgba(0,0,0,.12); }
.node .t { font-weight: 600; font-size: 13px; }
.node .f { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); display: flex; justify-content: space-between; gap: 8px; }
.node.flag { padding-right: 18px; }
.node.flag::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); }
.node .talk { position: absolute; bottom: -7px; right: -7px; background: var(--agent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 9px; padding: 0 5px; line-height: 16px; }
.node .talk.pending { background: var(--flag); }
.node.part { background: var(--part); border-color: var(--part); color: #fff; }
.node.part .f { color: #fff3d6; }
.node.step { border: 2px solid var(--coreline); }
.node.chg { border-left: 4px solid var(--uses); }
.node.gone { background: #fdecea; border: 1px dashed var(--flag); color: #b42318; }
.node.gone .t { text-decoration: line-through; }
.node.gone .f { color: #b42318; }
.node.new { border: 1px dashed var(--new); background: #eef8f2; }
#board.focus .node { opacity: .25; }
#board.focus .node.sel, #board.focus .node.rel-u, #board.focus .node.rel-b { opacity: 1; }
.node.sel { box-shadow: 0 0 0 3px var(--ink); }
.node.rel-u { box-shadow: 0 0 0 2px var(--uses); }
.node.rel-b { box-shadow: 0 0 0 2px var(--usedby); }
.after-only { display: none; }
body.after .after-only { display: revert; }
aside { width: 360px; position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; max-height: calc(100vh - 24px); overflow: auto; }
aside h2 { margin: 0 0 2px; font-size: 18px; }
aside .file { font: 12px ui-monospace, Menlo, monospace; color: var(--mute); margin-bottom: 10px; }
aside p { margin: 0 0 10px; }
aside h4 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 2px 7px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: none; font-family: inherit; }
.chip.u { color: var(--uses); border-color: var(--uses); }
.chip.b { color: var(--usedby); border-color: var(--usedby); }
.notice { background: #fdecea; border-left: 3px solid var(--flag); padding: 6px 8px; border-radius: 4px; font-size: 13px; }
.change { background: #eaf2fb; border-left: 3px solid var(--uses); padding: 6px 8px; border-radius: 4px; font-size: 13px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: var(--bg); color: var(--mute); margin-bottom: 8px; }
.empty { color: var(--mute); }
.msg { border-radius: 8px; padding: 6px 9px; margin: 6px 0; font-size: 13px; white-space: pre-wrap; }
.msg .who { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 2px; }
.msg.user { background: var(--bg); }
.msg.agent { background: #eaf2fb; }
.msg.agent .who { color: var(--agent); }
.msg.pending { background: #fff; border: 1px dashed var(--flag); }
.msg.pending .who { color: var(--flag); }
.msg .x { float: right; border: 0; background: none; cursor: pointer; color: var(--mute); font-size: 13px; }
textarea.note { width: 100%; min-height: 64px; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 5px 12px; font: inherit; cursor: pointer; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.notes-list { margin: 0; padding-left: 20px; }
.notes-list li { margin-bottom: 10px; }
.notes-list .q { font-weight: 600; }
#bar { position: fixed; right: 20px; bottom: 18px; z-index: 20; display: flex; gap: 8px; }
#reload { display: none; border-color: var(--agent); color: var(--agent); font-weight: 600; }
#reload.on { display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px #0a66c233; } }
#sheet { border: 0; border-radius: 12px; width: min(760px, 92vw); max-height: 84vh; padding: 16px; }
#sheet[open] { display: flex; flex-direction: column; gap: 10px; }
#sheet::backdrop { background: #0006; }
#sheet pre { margin: 0; overflow: auto; background: var(--bg); padding: 10px; border-radius: 8px; font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap; flex: 1; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 6px 14px; border-radius: 8px; display: none; z-index: 40; }
</style>
</head>

<script type="application/json" id="spec">{"id":"html-explain","title":"How html-explain works","subtitle":"the plugin itself · round 1","summary":"An agent studies a system and writes a spec: boxes in zones and arrows between them. A build step turns the spec into this page. You leave notes on boxes and arrows, copy them back, and the agent answers them in place and draws an After view.","round":1,"zones":[{"id":"you","title":"You","why":"Where a session starts and where notes come from.","span":4},{"id":"skill","title":"The skill","why":"What the agent reads before it writes anything.","span":8},{"id":"loop","title":"The review loop","style":"core","arrows":true,"columns":[{"title":"1 · Explore","nodes":["explore"]},{"title":"2 · Write","nodes":["spec","after"]},{"title":"3 · Build","nodes":["build","check"]},{"title":"4 · Read","nodes":["page","notes"]}],"flow":"↺ your notes come back as answers in place and changes in the After view"},{"id":"runtime","title":"Page runtime","why":"The JavaScript inside every built page.","span":8},{"id":"out","title":"Outputs","why":"What stays in your project.","span":4},{"id":"later","title":"After only","style":"outside","after_only":true,"why":"Proposed in round 1."}],"nodes":[{"id":"user","title":"You","zone":"you","kind":"part","desc":"Run `/html-explain \u003cwhat to explain>`: a whole repo, a module, or a question like \"how does auth work\"."},{"id":"skillmd","title":"SKILL.md","file":"skills/html-explain/SKILL.md","zone":"skill","desc":"The steps the agent follows: explore, write the spec, build, then answer notes round by round."},{"id":"specref","title":"Spec reference","file":"references/spec.md","zone":"skill","desc":"Every field of the spec with an example: zones, boxes, arrows, the After view, threads."},{"id":"example","title":"Example spec","file":"examples/html-explain.json","zone":"skill","desc":"This page's own spec, to copy from."},{"id":"explore","title":"Explore","zone":"loop","kind":"step","desc":"The agent reads the code the focus points at: modules, sizes, what calls what, and why things are the way they are."},{"id":"spec","title":"Spec","file":"\u003cname>.json","zone":"loop","kind":"step","desc":"The source of the page: zones, boxes with short plain descriptions, arrows, and red-dot notes on what may not fit a simple design."},{"id":"after","title":"After view","file":"spec.after","zone":"loop","desc":"The proposed system: boxes that change, go or appear, and a list of your notes with where each one lands."},{"id":"build","title":"Build","file":"runtime/build.mjs","zone":"loop","kind":"step","desc":"Checks the spec and writes one HTML file with the runtime and the spec inside it. No network, no dependencies."},{"id":"check","title":"Spec check","file":"build.mjs --check","zone":"loop","desc":"Unknown zones, nodes, arrows and thread keys stop the build with a message."},{"id":"page","title":"The page","file":"\u003cname>.html","zone":"loop","kind":"step","desc":"What you read: click a box or an arrow to see what it does and what it connects to."},{"id":"notes","title":"Notes","zone":"loop","desc":"Each box, arrow and the page itself takes notes. They stay in your browser until you copy them with Notes for the agent."},{"id":"render","title":"Render","file":"runtime/explain.js","zone":"runtime","desc":"Lays out zones and boxes, and draws the arrows of the selected box.","note":"Finding one box on a large page means scanning every zone by eye."},{"id":"panel","title":"Side panel","file":"runtime/explain.js","zone":"runtime","desc":"Shows the selected box or arrow: its description, what changes, its arrows, and its conversation."},{"id":"store","title":"Note store","file":"localStorage","zone":"runtime","desc":"Unsent notes, kept per page. A note the agent filed in the spec's threads disappears from it."},{"id":"html","title":"Page file","file":"\u003cname>.html","zone":"out","desc":"One file you can open, share or commit."},{"id":"json","title":"Spec file","file":"\u003cname>.json","zone":"out","desc":"The source; the agent edits it each round."}],"edges":[{"from":"user","to":"skillmd","label":"/html-explain"},{"from":"skillmd","to":"explore"},{"from":"explore","to":"spec"},{"from":"spec","to":"build"},{"from":"after","to":"build"},{"from":"build","to":"check"},{"from":"build","to":"page"},{"from":"page","to":"notes"},{"from":"notes","to":"user","label":"copy to the agent"},{"from":"page","to":"render"},{"from":"page","to":"panel"},{"from":"notes","to":"store"},{"from":"build","to":"html"},{"from":"spec","to":"json"},{"from":"specref","to":"spec"},{"from":"example","to":"spec"}],"after":{"label":"After","summary":"Round 1 adds a search box: type a name and the page selects the box.","nodes":{"render":{"status":"changed","change":"Selects the box a search names.","note":null}},"add":[{"id":"search","title":"Search box","file":"runtime/explain.js","zone":"later","desc":"Type part of a box's name or file; the first match is selected and its arrows drawn."}],"edges":{"add":[{"from":"search","to":"render","label":"selects"}]},"notes":[{"q":"How do I find one box on a big page?","a":"Today by eye. The After view adds a search box.","ids":["render","search"]}]},"threads":{"node:render":[{"id":"n1a2b3","by":"user","view":"before","text":"How do I find one box on a big page?"},{"by":"agent","text":"Today you scan the zones by eye. The After view adds a search box that selects the first box whose name or file matches."}]}}</script>
<script>
(() => {
  let S = JSON.parse(document.getElementById("spec").textContent);
  const LIVE = JSON.parse(document.getElementById("live")?.textContent || "null"); // set by serve.mjs
  const live = !!LIVE;
  const KEY = "html-explain:" + S.id;
  const $ = (q, el = document) => el.querySelector(q);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-HX-Token": LIVE.token } });

  // notes the agent has not answered yet: unsent, or sent in live mode; one filed in `threads` drops
  let pending = [];
  try { pending = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pending)); } catch {} };
  const unsent = () => pending.filter((n) => !n.sent);
  let threads = {};
  function absorb(spec) {
    S = spec;
    threads = S.threads || {};
    const answered = new Set(Object.values(threads).flat().map((m) => m.id).filter(Boolean));
    pending = pending.filter((n) => !answered.has(n.id));
    save();
  }
  absorb(S);
  const drafts = {}; // half-written notes by key: a redraw keeps them

  let mode = "before";
  let sel = null; // "node:<id>" or null
  let view, els = {};

  // the view model of one mode; `byKey` maps "node:<id>" to its box
  function build(m) {
    const nodes = {};
    for (const n of S.nodes) nodes[n.id] = { ...n };
    let edges = (S.edges || []).map((e) => ({ ...e }));
    const zones = (S.zones || []).filter((z) => (m === "after" ? !z.before_only : !z.after_only));
    if (m === "after" && S.after) {
      const a = S.after;
      for (const [id, p] of Object.entries(a.nodes || {})) {
        if (nodes[id]) nodes[id] = { ...nodes[id], ...p, status: p.status || "changed" };
      }
      for (const n of a.add || []) nodes[n.id] = { ...n, status: "new" };
      const drop = new Set(a.edges?.remove || []);
      const gone = (id) => nodes[id].status === "removed";
      edges = edges.filter((e) => !drop.has(`${e.from}>${e.to}`) && !gone(e.from) && !gone(e.to));
      edges = edges.concat((a.edges?.add || []).map((e) => ({ ...e })));
    }
    const byKey = new Map();
    for (const n of Object.values(nodes)) {
      Object.assign(n, { key: "node:" + n.id, out: [], in: [] });
      if (n.status === "removed") n.note = null;
      byKey.set(n.key, n);
    }
    for (const e of edges) {
      nodes[e.from].out.push(e);
      nodes[e.to].in.push(e);
    }
    return { nodes, edges, zones, byKey };
  }
  const picked = () => (sel ? view.byKey.get(sel) : null);
  const talk = (key) => (threads[key] || []).length + pending.filter((n) => n.el === key).length;

  function nodeEl(n) {
    const el = document.createElement("div");
    const cls = { changed: " chg", removed: " gone", new: " new" }[n.status] || "";
    el.className = "node" + (n.kind ? " " + n.kind : "") + (n.note ? " flag" : "") + cls;
    const size = n.status === "removed" ? "removed" : n.status === "changed" ? "edited" : (n.size ?? "");
    el.innerHTML = `<div class="t">${esc(n.title)}</div><div class="f"><span>${esc(n.file || "")}</span><span>${esc(size)}</span></div>`;
    const k = talk(n.key);
    if (k) {
      const mine = pending.some((p) => p.el === n.key);
      el.insertAdjacentHTML("beforeend", `<span class="talk${mine ? " pending" : ""}">${k}</span>`);
    }
    el.onclick = (e) => { e.stopPropagation(); select(n.key); };
    els[n.id] = el;
    return el;
  }

  function render() {
    if (mode === "after" && !S.after) mode = "before";
    document.body.classList.toggle("after", mode === "after");
    header();
    view = build(mode);
    els = {};
    const board = $("#board");
    board.querySelectorAll(".zone").forEach((z) => z.remove());
    const placed = new Set();
    for (const z of view.zones) {
      const sec = document.createElement("section");
      sec.className = "zone" + (z.style ? " " + z.style : "");
      sec.style.gridColumn = `span ${z.span || 12}`;
      sec.innerHTML = `<h2>${esc(z.title)}</h2>${z.why ? `<div class="why">${md(z.why)}</div>` : ""}`;
      if (z.columns) {
        const cols = document.createElement("div");
        cols.className = "cols";
        cols.style.gridTemplateColumns = `repeat(${z.columns.length}, 1fr)`;
        z.columns.forEach((c, i) => {
          const col = document.createElement("div");
          col.className = "col";
          col.innerHTML = c.title ? `<h3>${esc(c.title)}</h3>` : "";
          for (const id of c.nodes || []) {
            if (view.nodes[id]) { col.append(nodeEl(view.nodes[id])); placed.add(id); }
          }
          if (z.arrows && i < z.columns.length - 1) col.insertAdjacentHTML("beforeend", `<span class="arrow">→</span>`);
          cols.append(col);
        });
        sec.append(cols);
      }
      const rest = Object.values(view.nodes).filter((n) => n.zone === z.id && !placed.has(n.id));
      if (rest.length) {
        const box = document.createElement("div");
        box.className = "nodes";
        rest.forEach((n) => { box.append(nodeEl(n)); placed.add(n.id); });
        sec.append(box);
      }
      if (z.flow) sec.insertAdjacentHTML("beforeend", `<div class="flowline">${md(z.flow)}</div>`);
      board.append(sec);
    }
    select(view.byKey.has(sel) ? sel : null);
    refreshBar();
  }

  // ---- arrows: those marked `always`, plus the selected box's. They are drawn above the boxes,
  // from edge to edge, so the boxes they join never hide them.
  const NS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, text) {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text) el.textContent = text;
    return el;
  }
  const MARKERS = ["", "u", "b"].map((c) =>
    `<marker id="arrow${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ${c}" d="M0,1 L9,5 L0,9 z"/></marker>`).join("");
  function draw() {
    const wires = $("#wires");
    const b = $("#board").getBoundingClientRect();
    const box = (el) => {
      const r = el.getBoundingClientRect();
      return { x: r.left - b.left + r.width / 2, y: r.top - b.top + r.height / 2, w: r.width / 2 + 3, h: r.height / 2 + 3 };
    };
    // where the line from a box's centre towards the other box's centre leaves it, plus a gap
    const rim = (a, o) => {
      const dx = o.x - a.x, dy = o.y - a.y;
      const t = Math.min(a.w / Math.abs(dx || 1e-9), a.h / Math.abs(dy || 1e-9));
      return [a.x + dx * t, a.y + dy * t];
    };
    const node = sel ? sel.slice(5) : null;
    const shown = view.edges.filter((e) => e.always || e.from === node || e.to === node);
    let html = `<defs>${MARKERS}</defs>`;
    const labels = [], taken = [];
    for (const e of shown) {
      if (!els[e.from] || !els[e.to]) continue;
      const A = box(els[e.from]), B = box(els[e.to]);
      const [x1, y1] = rim(A, B), [x2, y2] = rim(B, A);
      const len = Math.hypot(x2 - x1, y2 - y1) || 1;
      // boxes that nearly touch get no line: the outline and the panel already show the link
      if ((x2 - x1) * (B.x - A.x) + (y2 - y1) * (B.y - A.y) <= 0 || len < 10) continue;
      const bend = len < 60 ? 0 : Math.min(36, len / 7); // short hops stay straight
      const cx = (x1 + x2) / 2 + ((y2 - y1) / len) * bend, cy = (y1 + y2) / 2 - ((x2 - x1) / len) * bend;
      const cls = node === e.to ? "b" : node === e.from ? "u" : node ? "bg" : "";
      const head = cls === "bg" ? "" : cls;
      html += `<path class="w ${cls}" d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" marker-end="url(#arrow${head})"/>`;
      // a label sits at the curve's middle, unless another label is already there
      const lx = (x1 + 2 * cx + x2) / 4, ly = (y1 + 2 * cy + y2) / 4 - 4, half = e.label ? e.label.length * 3.3 + 4 : 0;
      const clash = taken.some(([x, y, h]) => Math.abs(x - lx) < h + half && Math.abs(y - ly) < 14);
      if (e.label && cls !== "bg" && !clash) {
        taken.push([lx, ly, half]);
        labels.push(svg("text", { x: lx, y: ly, class: "w " + cls }, e.label));
      }
    }
    wires.innerHTML = html;
    wires.append(...labels);
  }
  let frame = 0;
  const redraw = () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(draw); };

  // ---- the side panel
  function chip(id, cls) {
    const n = view.nodes[id];
    return n ? `<button class="chip ${cls}" data-key="${esc(n.key)}">${esc(n.title)}</button>` : "";
  }
  function edgeChip(e, other, cls) {
    const n = view.nodes[other];
    return `<button class="chip ${cls}" data-key="${esc(n.key)}">${esc(n.title)}${e.label ? " · " + esc(e.label) : ""}</button>`;
  }
  const chips = (list, f) => (list.length ? `<div class="chips">${list.map(f).join("")}</div>` : `<div class="empty">none</div>`);
  function thread(key) {
    const msgs = (threads[key] || []).map((m) =>
      `<div class="msg ${m.by === "agent" ? "agent" : "user"}"><span class="who">${m.by === "agent" ? "Agent" : "You"}${m.view ? " · " + esc(m.view) : ""}</span>${md(m.text)}</div>`);
    const mine = pending.filter((n) => n.el === key).map((n) => n.sent
      ? `<div class="msg pending"><span class="who">You · sent, the agent is on it</span>${md(n.text)}</div>`
      : `<div class="msg pending"><button class="x" data-del="${esc(n.id)}" title="Delete">✕</button><span class="who">You · not sent yet</span>${md(n.text)}</div>`);
    return `<h4>Notes and questions</h4>${msgs.join("")}${mine.join("")}
      <textarea class="note" data-for="${esc(key)}" placeholder="A question, a change you want, or a reply…"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px"><button class="btn primary" data-add="${esc(key)}">Add note</button></div>`;
  }
  function panel() {
    const p = $("#panel");
    const old = p.querySelector("textarea.note");
    const typing = old && document.activeElement === old;
    const caret = typing ? [old.selectionStart, old.selectionEnd] : null;
    if (old) drafts[old.dataset.for] = old.value;
    const scroll = p.scrollTop;
    const it = picked();
    let html;
    if (!it) {
      const a = mode === "after" && S.after;
      html = `<h2>${esc(a ? a.label || "After" : "Click a box")}</h2>
        <p>${md(a ? a.summary || "" : S.summary || "")}</p>
        <p class="empty">${live
          ? "Click a box to read it, see its arrows and leave a note. The agent sees each note as you add it and answers here; <b>↻ Load the agent's changes</b> shows its answers in place."
          : "Click a box to read it, see its arrows and leave a note. Notes stay in this browser until you copy them to the agent with <b>Notes for the agent</b>."}</p>`;
      if (a?.notes?.length) {
        html += `<h4>Your notes and where they land</h4><ol class="notes-list">${a.notes.map((x) =>
          `<li><div class="q">${md(x.q)}</div><div>${md(x.a)}</div><div class="chips">${(x.ids || []).map((id) => chip(id, "")).join("")}</div></li>`).join("")}</ol>`;
      }
      html += thread("page");
    } else {
      const tag = it.status === "removed" ? "removed" : it.status === "new" ? "new" : it.tag;
      html = `${tag ? `<span class="tag">${esc(tag)}</span>` : ""}<h2>${esc(it.title)}</h2>
        <div class="file">${esc(it.file || "")}${it.size && mode === "before" ? " · " + esc(it.size) : ""}</div>
        <p>${md(it.desc)}</p>
        ${it.change ? `<h4>What changes</h4><p class="change">${md(it.change)}</p>` : ""}
        ${it.note ? `<h4>Worth a look</h4><p class="notice">${md(it.note)}</p>` : ""}
        ${it.status === "removed" ? "" : `<h4>Uses</h4>${chips(it.out, (e) => edgeChip(e, e.to, "u"))}
        <h4>Used by</h4>${chips(it.in, (e) => edgeChip(e, e.from, "b"))}`}
        ${thread(it.key)}`;
    }
    p.innerHTML = html;
    const ta = p.querySelector("textarea.note");
    ta.value = drafts[ta.dataset.for] || "";
    ta.oninput = () => (drafts[ta.dataset.for] = ta.value);
    if (typing && old.dataset.for === ta.dataset.for) {
      ta.focus();
      ta.setSelectionRange(...caret);
    }
    p.scrollTop = scroll;
    p.querySelectorAll("[data-key]").forEach((b) => (b.onclick = (ev) => { ev.stopPropagation(); select(b.dataset.key); }));
    p.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { pending = pending.filter((n) => n.id !== b.dataset.del); save(); render(); }));
    p.querySelector("[data-add]").onclick = async (ev) => {
      const key = ev.currentTarget.dataset.add;
      const text = ta.value.trim();
      if (!text) return;
      const note = { id: "n" + Math.random().toString(36).slice(2, 7), el: key, view: mode, text };
      if (live) {
        try { note.sent = (await api("/api/notes", { method: "POST", body: JSON.stringify(note) })).ok; } catch {}
        if (!note.sent) toast("Could not reach the agent's server: kept here, copy it with Notes for the agent");
      }
      pending.push(note);
      drafts[key] = "";
      save();
      render();
    };
  }

  function select(key) {
    sel = key || null;
    $("#board").classList.toggle("focus", !!sel);
    Object.values(els).forEach((e) => e.classList.remove("sel", "rel-u", "rel-b"));
    const it = picked();
    const mark = (id, cls) => els[id]?.classList.add(cls);
    if (it) {
      mark(it.id, "sel");
      it.out.forEach((e) => mark(e.to, "rel-u"));
      it.in.forEach((e) => mark(e.from, "rel-b"));
    }
    history.replaceState(null, "", "#" + mode + (sel ? "/" + sel : ""));
    panel();
    draw();
  }

  // ---- notes for the agent, offline: one block to paste into the chat
  function label(key) {
    if (key === "page") return "the whole page";
    const id = key.slice(5);
    const n = [...S.nodes, ...(S.after?.add || [])].find((x) => x.id === id);
    return `box \`${id}\` (${n ? n.title : "?"}${n?.file ? ", " + n.file : ""})`;
  }
  function exportText() {
    const by = {};
    for (const n of unsent()) (by[n.el] ||= []).push(n);
    const lines = [`# Notes on "${S.title}" (${S.id}, round ${S.round || 0})`, "",
      "File each note in `threads` under its key with its id, answer it there, and update `after`.", ""];
    for (const [key, notes] of Object.entries(by)) {
      lines.push(`## ${label(key)} · key \`${key}\``);
      for (const t of threads[key] || []) lines.push(`- earlier, ${t.by === "agent" ? "agent" : "me"}: ${t.text.replace(/\n/g, " ")}`);
      for (const n of notes) lines.push(`- [${n.id}] (seen in ${n.view}) ${n.text.replace(/\n/g, "\n  ")}`);
      lines.push("");
    }
    return lines.join("\n");
  }
  function refreshBar() {
    const left = unsent().length, waiting = pending.length - left;
    $("#notes-btn").textContent = live && !left
      ? `Live · the agent reads each note${waiting ? ` (${waiting} waiting)` : ""}`
      : `Notes for the agent (${left})`;
  }
  function toast(t) {
    const el = $("#toast");
    el.textContent = t;
    el.style.display = "block";
    setTimeout(() => (el.style.display = "none"), 2400);
  }

  const LEGEND = [["part", "key part"], ["step", "main step"], ["", "module"], ["dot", "worth a look"]];
  const LEGEND_AFTER = [["chg", "changes"], ["gone", "removed"], ["new", "new"]];
  function header() {
    document.title = S.title.replace(/`/g, "");
    const sw = ([cls, t], extra = "") => `<span class="${extra}"><span class="sw ${cls}"></span>${t}</span>`;
    $("header").innerHTML = `<h1>${md(S.title)}</h1>
      ${S.after ? `<span class="switch"><button data-mode="before">Before</button><button data-mode="after">${esc(S.after.label || "After")}</button></span>` : ""}
      ${S.subtitle ? `<span class="sub">${md(S.subtitle)}</span>` : ""}
      <span class="legend">${LEGEND.map((x) => sw(x)).join("")}${LEGEND_AFTER.map((x) => sw(x, "after-only")).join("")}
        <span class="u">━ uses</span><span class="b">┅ used by</span></span>`;
    document.querySelectorAll(".switch button").forEach((b) => {
      b.classList.toggle("on", b.dataset.mode === mode);
      b.onclick = () => { mode = b.dataset.mode; render(); };
    });
  }

  document.body.innerHTML = `
    <header></header>
    <div class="wrap"><div id="board"><svg id="wires"></svg></div><aside id="panel"></aside></div>
    <div id="bar"><button class="btn" id="reload" title="Load the agent's changes into this page">↻ Load the agent's changes</button><button class="btn primary" id="notes-btn"></button></div>
    <dialog id="sheet"><b>Notes for the agent</b>
      <span class="empty">Copy this and paste it to the agent. It answers each note in place and updates the After view.</span>
      <pre id="sheet-text"></pre>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="sheet-close">Close</button><button class="btn primary" id="sheet-copy">Copy</button></div></dialog>
    <div id="toast"></div>`;
  $("#board").onclick = () => select(null);
  $("#notes-btn").onclick = () => {
    if (!unsent().length) return toast(live ? "The agent already has every note" : "No notes yet: click a box to add one");
    $("#sheet-text").textContent = exportText();
    $("#sheet").showModal();
  };
  $("#sheet-close").onclick = () => $("#sheet").close();
  $("#sheet-copy").onclick = async () => {
    const text = $("#sheet-text").textContent;
    try { await navigator.clipboard.writeText(text); } catch {
      const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    toast("Copied: paste it to the agent");
  };
  addEventListener("resize", redraw);

  const [m, ...rest] = location.hash.slice(1).split("/");
  if (m === "after" && S.after) mode = "after";
  sel = rest.join("/") || null;
  render();

  // live mode: the agent's saves wait behind the reload button; a click loads them in place, and
  // the page itself never reloads, so a half-written note survives
  if (!live) return;
  let incoming = null;
  $("#reload").onclick = () => {
    if (!incoming) return;
    absorb(incoming);
    incoming = null;
    $("#reload").classList.remove("on");
    render();
  };
  (async () => {
    let version = LIVE.version;
    for (;;) {
      let r = null;
      try { r = await api("/api/spec?since=" + version); } catch {}
      if (r?.status === 200) {
        const d = await r.json();
        version = d.version;
        incoming = d.spec;
        $("#reload").classList.add("on");
      } else if (r?.status === 403) {
        $("#notes-btn").textContent = "The live server restarted: reload this page";
        return;
      } else if (r?.status !== 204) {
        await new Promise((ok) => setTimeout(ok, 2000)); // server down: try again
      }
    }
  })();
})();
</script>
</body>
</html>
